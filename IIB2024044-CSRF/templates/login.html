
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopEase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <a class="brand login-brand" href="{{ url_for('login') }}">ShopEase</a>

        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in to your account</h1>
        <p class="muted">Access your profile and delivery information.</p>

        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="form-stack">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button class="button button-primary button-full" type="submit">
                Sign in
            </button>
        </form>

        <div class="demo-credentials">
            <strong>Local demo account</strong>
            <p>Username: <code>customer</code></p>
            <p>Password: <code>demo123</code></p>
        </div>
    </main>
</body>
</html>
