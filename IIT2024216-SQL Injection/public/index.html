<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecureGate | Login</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a);
        color: #172033;
      }

      .card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 38px;
        border-radius: 18px;
        box-shadow: 0 24px 70px #0005;
      }

      .brand {
        color: #1d4ed8;
        font-size: 18px;
        font-weight: 800;
      }

      .subtitle {
        color: #64748b;
        line-height: 1.5;
        font-size: 14px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }

      label {
        display: block;
        margin: 18px 0 7px;
        font-weight: 600;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
      }

      input:focus {
        outline: 2px solid #93c5fd;
        border-color: #2563eb;
      }

      button {
        width: 100%;
        padding: 13px;
        margin-top: 23px;
        border: none;
        border-radius: 8px;
        background: #1d4ed8;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #1e40af;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      #result {
        display: none;
        margin-top: 18px;
        padding: 13px;
        border-radius: 8px;
        line-height: 1.5;
        font-size: 14px;
      }

      #result.success {
        display: block;
        color: #166534;
        background: #dcfce7;
        border: 1px solid #bbf7d0;
      }

      #result.failure {
        display: block;
        color: #991b1b;
        background: #fee2e2;
        border: 1px solid #fecaca;
      }

      .notice {
        margin-top: 22px;
        font-size: 11px;
        color: #94a3b8;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div class="brand">◈ SecureGate</div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />

        <button id="loginButton" type="submit">Sign in</button>
      </form>

      <div id="result" role="status" aria-live="polite"></div>

      <div class="notice">
        Cyber Security coursework demonstration.<br />
        Local testing only — do not deploy the vulnerable version.
      </div>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const result = document.getElementById("result");
      const button = document.getElementById("loginButton");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        result.className = "";
        result.style.display = "none";
        button.disabled = true;
        button.textContent = "Signing in...";

        const credentials = {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        };

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(credentials),
          });

          const data = await response.json();

          result.className = data.authenticated ? "success" : "failure";

          result.style.display = "block";

          if (data.authenticated) {
            result.textContent =
              "Login successful! Welcome, " + data.user.username + ".";
          } else {
            result.textContent =
              data.message || "Invalid username or password.";
          }
        } catch (error) {
          result.className = "failure";
          result.style.display = "block";
          result.textContent =
            "Cannot connect to the server. Check that it is running.";
        } finally {
          button.disabled = false;
          button.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
